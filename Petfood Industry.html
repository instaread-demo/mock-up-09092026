document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 0 0;color:#5c6670;font-size:17px;line-height:1.5;max-width:820px;text-wrap:pretty\">Executives at the 2026 Animal Health Summit in Kansas City said the industry's future will hinge on simplifying care delivery, expanding access and extending animals' healthy years.<\u002Fp>\n      <div style=\"color:#555;font-size:14px;margin-top:14px\">September 8, 2026<\u002Fdiv>\n      <div style=\"display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap;margin-top:26px\">\n        <aside style=\"flex:0 1 120px;min-width:90px\">\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <div style=\"width:30px;height:30px;background:#2b2f36;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px\">🖨<\u002Fdiv>\n            <div style=\"width:30px;height:30px;background:#1877f2;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:Georgia,serif\">f<\u002Fdiv>\n            <div style=\"width:30px;height:30px;background:#0a66c2;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px\">in<\u002Fdiv>\n            <div style=\"width:30px;height:30px;background:#111;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px\">𝕏<\u002Fdiv>\n            <div style=\"width:30px;height:30px;background:#bd081c;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px\">P<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Faside>\n        <article style=\"flex:1 1 460px;max-width:700px;min-width:0\">\n          <div ref=\"{{ playerRef }}\" style=\"background:#ffffff;border:1px solid #e3e6ec;border-radius:8px;padding:8px 10px;display:flex;gap:12px;flex-wrap:nowrap;box-shadow:0 1px 4px rgba(0,0,0,0.08);margin:0 0 24px\">\n            <div style=\"flex:1 1 auto;min-width:0;display:flex;flex-direction:column\">\n              <div style=\"font-size:13px;font-weight:700;color:#111318;line-height:16px\">Listen to audio version of this article<\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:14px;margin-top:10px\">\n                <div role=\"button\" aria-label=\"Play\" sc-camel-on-click=\"{{ togglePlay }}\" style=\"width:38px;height:38px;border-radius:50%;background:#0e3a5c;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer\">\n                  <sc-if value=\"{{ notPlaying }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"14\" height=\"16\" sc-camel-view-box=\"0 0 18 20\" style=\"margin-left:3px\"><path d=\"M2 1.5 L16.5 10 L2 18.5 Z\" fill=\"#ffffff\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                  <sc-if value=\"{{ playing }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"14\" height=\"16\" sc-camel-view-box=\"0 0 18 20\"><rect x=\"3\" y=\"2\" width=\"4\" height=\"16\" rx=\"1\" fill=\"#ffffff\"><\u002Frect><rect x=\"11\" y=\"2\" width=\"4\" height=\"16\" rx=\"1\" fill=\"#ffffff\"><\u002Frect><\u002Fsvg><\u002Fsc-if>\n                <\u002Fdiv>\n                <div ref=\"{{ waveRef }}\" style=\"flex:1;min-width:60px;display:flex;align-items:center;gap:3px;height:36px;overflow:hidden\">\n                  <sc-for list=\"{{ bars }}\" as=\"bar\" hint-placeholder-count=\"40\">\n                    <div style=\"width:3px;border-radius:2px;background:#c6cbd4;height:{{ bar.h }}px;flex-shrink:0;transform-origin:center;animation:{{ bar.anim }}\"><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:9px;padding-right:6px\">\n                <img src=\"1db0b38d-fb1b-43a6-aff8-f4f3df9b5167\" alt=\"\" style=\"height:11px;width:auto;display:block\">\n                <span style=\"font-size:11px;font-weight:600;color:#6d7480\">Instaread<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:0 1 185px;min-width:100px;align-self:flex-start\">\n              <div style=\"font-size:11px;font-weight:700;color:#9aa1ac;margin-bottom:5px;line-height:16px\">Sponsored by<\u002Fdiv>\n              <img src=\"47c69e02-d876-423c-b857-993fbf03de00\" alt=\"Netflix\" style=\"width:100%;height:auto;display:block;border-radius:4px\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"color:#2b2f36;font-size:17px;line-height:1.8\">\n            <p style=\"margin:0 0 24px;text-wrap:pretty\">More than 675 animal health executives, investors, entrepreneurs and other industry leaders gathered in Kansas City for the <a href=\"#\">2026 Animal Health Summit<\u002Fa>. Presentations and discussions centered on three themes: innovation that eases workloads, broader access to care, and a growing focus on longevity.<\u002Fp>\n            <h2 style=\"margin:0 0 16px;font-size:23px;font-weight:700\">Innovation that simplifies<\u002Fh2>\n            <p style=\"margin:0 0 24px;text-wrap:pretty\">As veterinary teams face rising workloads and a growing number of technologies, speakers said innovation increasingly will be judged by whether it reduces work for veterinary teams.<\u002Fp>\n            <p style=\"margin:0 0 24px;text-wrap:pretty\">\"We have to look at it through the lens of, is this going to take work off of the team, or are we adding another step?\" said Julia Loew, chief commercial officer for MWI Animal Health. She said disconnected technologies can create fragmented records and duplicative work, adding to the mental load on veterinary teams. Automation and connected workflows, she said, can instead free up time for patient care and team engagement.<\u002Fp>\n            <p style=\"margin:0 0 24px;text-wrap:pretty\">Industry consultants Chad Terrell and Juerg Baggenstoss of Stonehaven Cozmix said roughly two-thirds of industry growth over the past decade has come from new products and innovation. They said they expect innovation to remain a primary growth driver even as the overall market matures, adding that innovation spans a range from major therapies to smaller changes in formulation or delivery.<\u002Fp>\n            <p style=\"margin:0 0 24px;text-wrap:pretty\">Artificial intelligence is increasingly part of the industry's approach, but executives said differentiation is shifting. Rauf Gurbuz, U.S. president and general manager of <a href=\"#\">Hill's Pet Nutrition<\u002Fa>, said AI differentiation will come from tools built on proprietary clinical and biological data and integrated into company operations.<\u002Fp>\n            <p style=\"margin:0 0 24px;text-wrap:pretty\">Scott Bormann, senior vice president, North America, at Merck Animal Health, said, \"It's not a matter of whether it's going to be here. It's a matter of how you choose to use it.\"<\u002Fp>\n            <h2 style=\"margin:0 0 16px;font-size:23px;font-weight:700\">Focus on access and affordability<\u002Fh2>\n            <p style=\"margin:0 0 24px;text-wrap:pretty\">Panelists said scientific advances have limited value if veterinarians, producers or pet owners cannot access them. Loew described access to care as a structural issue across both companion and production animal health. She said pet owners increasingly expect continuous, affordable care, while the production sector faces ongoing shortages of veterinarians and skilled labor needed to deliver new solutions at scale.<\u002Fp>\n            <p style=\"margin:0 0 24px;text-wrap:pretty\">\"You need to have the right infrastructure, the right economics and the right delivery mechanisms,\" Loew said.<\u002Fp>\n            <p style=\"margin:0;text-wrap:pretty\">Terrell and Baggenstoss said about $15 billion in revenue among leading animal health brands is already off patent or will lose patent protection in coming years, while generics are being introduced more quickly than in the past. They said this trend could help meet consumer demand for affordable medicines while increasing pressure on both pioneer and generic manufacturers to differentiate through continued innovation.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <aside style=\"flex:1 1 220px;max-width:290px\">\n          <div style=\"border:1px solid #eee;background:#fafafa;height:220px;display:flex;align-items:center;justify-content:center;color:#999;font-size:11px\">Advertisement<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:800;color:#2b2f36;letter-spacing:.04em;border-top:3px solid #0e3a5c;margin-top:26px;padding-top:10px\">RECOMMENDED<\u002Fdiv>\n          <img src=\"02daca64-cd67-49b9-8ef0-a44236850d46\" alt=\"Recommended stories\" style=\"width:100%;height:auto;display:block;margin-top:10px\">\n        <\u002Faside>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <footer style=\"background:#141414;text-align:center;padding:16px 16px 20px\">\n    <div style=\"font-weight:900;font-size:16px\"><span style=\"color:#fff\">PETFOOD<\u002Fspan><span style=\"color:#9aa4b0;font-weight:600\">INDUSTRY<\u002Fspan><\u002Fdiv>\n    <div style=\"color:#d8d8d8;font-size:12px;margin-top:8px\">© 2026 Instaread Demo Factory — Original layout built for demonstration purposes only.<\u002Fdiv>\n  <\u002Ffooter>\n  <sc-if value=\"{{ showBar }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:{{ barBottom }};z-index:2900;left:50%;transform:translateX(-50%);width:{{ barWidth }};pointer-events:none\">\n      <div style=\"pointer-events:auto;width:100%;background:#0f1317;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,0.45);display:flex;align-items:center;gap:14px;padding:10px 16px;box-sizing:border-box\">\n        <div role=\"button\" aria-label=\"Play\" sc-camel-on-click=\"{{ togglePlay }}\" style=\"width:38px;height:38px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer\">\n          <sc-if value=\"{{ notPlaying }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"13\" height=\"15\" sc-camel-view-box=\"0 0 18 20\" style=\"margin-left:2px\"><path d=\"M2 1.5 L16.5 10 L2 18.5 Z\" fill=\"#0f1317\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ playing }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"13\" height=\"15\" sc-camel-view-box=\"0 0 18 20\"><rect x=\"3\" y=\"2\" width=\"4\" height=\"16\" rx=\"1\" fill=\"#0f1317\"><\u002Frect><rect x=\"11\" y=\"2\" width=\"4\" height=\"16\" rx=\"1\" fill=\"#0f1317\"><\u002Frect><\u002Fsvg><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden\">\n            <span style=\"color:#2ea3f2;font-weight:800;font-size:11px;letter-spacing:.1em;flex-shrink:0\">NOW PLAYING<\u002Fspan>\n            <span style=\"color:#fff;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis\">Animal Health Summit highlights innovation, access, longevity trends<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:relative;height:5px;background:#3a4149;border-radius:3px;margin-top:8px\">\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:{{ progressPct }};background:#2ea3f2;border-radius:3px\"><\u002Fdiv>\n            <div style=\"position:absolute;top:50%;left:{{ progressPct }};transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;background:#2ea3f2\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span style=\"color:#cfd6dd;font-size:13px;white-space:nowrap;flex-shrink:0\">{{ timeLabel }} / 1:32<\u002Fspan>\n        <div role=\"button\" aria-label=\"Back 15 seconds\" sc-camel-on-click=\"{{ skipBack }}\" style=\"width:36px;height:36px;border-radius:50%;border:1.5px solid #8a939c;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer\">−15<\u002Fdiv>\n        <div role=\"button\" aria-label=\"Forward 15 seconds\" sc-camel-on-click=\"{{ skipFwd }}\" style=\"width:36px;height:36px;border-radius:50%;border:1.5px solid #8a939c;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer\">+15<\u002Fdiv>\n        <div role=\"button\" aria-label=\"Close\" sc-camel-on-click=\"{{ closeBar }}\" style=\"color:#fff;font-size:20px;line-height:1;cursor:pointer;flex-shrink:0;padding:4px\">✕<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"position:fixed;right:12px;bottom:12px;z-index:2950;background:#101010;color:#FFD400;font-weight:800;font-size:12px;letter-spacing:.04em;padding:8px 12px;border:2px solid #FFD400;border-radius:6px;pointer-events:none\">VISUAL DEMO ONLY — NO AUDIO<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDisclaimer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { barCount: 48, playing: false, time: 0, closed: false, pastPlayer: false, barLeft: '0px', barWidth: '100%' };\n  duration = 92;\n  togglePlay = () => {\n    const playing = !this.state.playing;\n    this.setState({ playing });\n    if (playing && !this._tick) {\n      this._tick = setInterval(() => {\n        this.setState(s => {\n          if (!s.playing) return null;\n          const t = s.time + 1;\n          if (t >= this.duration) { clearInterval(this._tick); this._tick = null; return { time: this.duration, playing: false }; }\n          return { time: t };\n        });\n      }, 1000);\n    } else if (!playing && this._tick) { clearInterval(this._tick); this._tick = null; }\n  };\n  skipBack = () => this.setState(s => ({ time: Math.max(0, s.time - 15) }));\n  skipFwd = () => this.setState(s => ({ time: Math.min(this.duration, s.time + 15) }));\n  closeBar = () => this.setState({ closed: true });\n  playerRef = (el) => { this._playerEl = el; };\n  componentDidMount() {\n    this._onScroll = () => {\n      const el = this._playerEl;\n      if (!el) return;\n      const r = el.getBoundingClientRect();\n      const passed = r.bottom < 0;\n      const barLeft = Math.round(r.left) + 'px';\n      const barWidth = Math.round(r.width * 0.85) + 'px';\n      const overlap = (window.innerWidth / 2 + r.width / 2) > (window.innerWidth - 255);\n      const barBottom = overlap ? '58px' : '16px';\n      if (passed !== this.state.pastPlayer || barLeft !== this.state.barLeft || barWidth !== this.state.barWidth || barBottom !== this.state.barBottom) this.setState({ pastPlayer: passed, barLeft, barWidth, barBottom });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    window.addEventListener('resize', this._onScroll);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    if (this._tick) clearInterval(this._tick);\n    if (this._ro) this._ro.disconnect();\n  }\n  waveRef = (el) => {\n    if (this._ro) { this._ro.disconnect(); this._ro = null; }\n    if (!el) return;\n    this._ro = new ResizeObserver(() => {\n      const w = el.clientWidth;\n      const c = Math.max(14, Math.floor((w + 3) / 6));\n      if (c !== this.state.barCount) this.setState({ barCount: c });\n    });\n    this._ro.observe(el);\n  };\n  renderVals() {\n    const playing = this.state.playing;\n    const bars = [];\n    for (let i = 0; i < this.state.barCount; i++) {\n      const v = Math.abs(Math.sin(i * 0.93) * 0.62 + Math.sin(i * 0.31 + 1.4) * 0.38);\n      bars.push({\n        h: Math.max(5, Math.min(30, Math.round(6 + 24 * v))),\n        anim: playing ? 'ir-wave 1.1s ease-in-out ' + ((i % 12) * 0.09).toFixed(2) + 's infinite' : 'none'\n      });\n    }\n    return {\n      bars,\n      playing,\n      notPlaying: !playing,\n      togglePlay: this.togglePlay,\n      waveRef: this.waveRef,\n      skipBack: this.skipBack,\n      skipFwd: this.skipFwd,\n      closeBar: this.closeBar,\n      playerRef: this.playerRef,\n      showBar: this.state.pastPlayer && !this.state.closed,\n      barBottom: this.state.barBottom ?? '16px',\n      barLeft: this.state.barLeft,\n      barWidth: this.state.barWidth,\n      timeLabel: Math.floor(this.state.time / 60) + ':' + String(this.state.time % 60).padStart(2, '0'),\n      progressPct: Math.round((this.state.time / this.duration) * 100) + '%',\n      showDisclaimer: this.props.showDisclaimer ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
